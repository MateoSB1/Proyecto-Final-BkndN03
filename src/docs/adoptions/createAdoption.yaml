paths:
  /api/adoptions:
    post:
      summary: Crear una nueva adopción
      description: Crea una relación entre un usuario y una mascota
      tags:
        - Adoptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owner
                - pet
              properties:
                owner:
                  type: string
                  format: ObjectId
                  description: ID del usuario que adopta
                pet:
                  type: string
                  format: ObjectId
                  description: ID de la mascota adoptada
      responses:
        201:
          description: Adopción creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adoption"
        400:
          description: Datos inválidos o faltantes
        500:
          description: Error interno del servidor
