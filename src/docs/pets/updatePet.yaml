paths:
  /api/pets/{id}:
    put:
      summary: Actualizar mascota
      description: Edita una mascota existente
      tags:
        - Pets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: ObjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                specie:
                  type: string
                adopted:
                  type: boolean
                owner:
                  type: string
                  format: ObjectId
                image:
                  type: string
                birthDate:
                  type: string
      responses:
        '200':
          description: Mascota actualizada
        '404':
          description: Mascota no encontrada
        '500':
          description: Error interno