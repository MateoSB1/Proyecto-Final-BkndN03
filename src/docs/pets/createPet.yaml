paths:
  /api/pets:
    post:
      summary: Crear una nueva mascota
      description: Crea una nueva mascota con datos proporcionados
      tags:
        - Pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - specie
                - birthDate
              properties:
                name:
                  type: string
                  description: Nombre de la mascota
                specie:
                  type: string
                  description: Especie (Perro, Gato, etc.)
                adopted:
                  type: boolean
                  description: Si ya está adoptada
                owner:
                  type: string
                  format: ObjectId
                  description: ID del dueño
                image:
                  type: string
                  description: URL de imagen
                birthDate:
                  type: string
                  description: Fecha de nacimiento
      responses:
        "201":
          description: Mascota creada exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: Datos inválidos
        "500":
          description: Error interno
