paths:
  /api/pets/{id}:
    delete:
      summary: Eliminar mascota
      description: Elimina una mascota por su ID
      tags:
        - Pets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: ObjectId
      responses:
        '200':
          description: Mascota eliminada
        '404':
          description: Mascota no encontrada
        '500':
          description: Error interno