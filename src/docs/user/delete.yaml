delete:
  summary: "Eliminar un usuario"
  description: "Elimina un usuario por su ID"
  tags:
    - Users
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: ObjectId
  responses:
    200:
      description: "Usuario eliminado correctamente"
    404:
      description: "Usuario no encontrado"
    500:
      description: "Error interno del servidor"